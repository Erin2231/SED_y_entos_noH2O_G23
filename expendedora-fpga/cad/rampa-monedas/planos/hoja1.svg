<svg xmlns='http://www.w3.org/2000/svg' width='297mm' height='210mm' viewBox='0 0 297 210' font-family='DejaVu Sans, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id='ar' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='2.6' markerHeight='2.6' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0 1.5L10 5L0 8.5z' fill='#0b5cad'/></marker><marker id='ak' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='2.4' markerHeight='2.4' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0 1.5L10 5L0 8.5z' fill='#111'/></marker></defs><rect width='297' height='210' fill='white'/><rect x='6' y='6' width='285' height='198' fill='none' stroke='#111' stroke-width='0.5'/><text x='20.00' y='34.00' font-size='8' text-anchor='start' fill='#111' font-weight='bold'>Sistema de monedas de la máquina expendedora</text><text x='20.00' y='44.00' font-size='4' text-anchor='start' fill='#555' font-weight='normal'>Planos para modelar en CAD: carril de medida (pieza A) y cubilete de espera (pieza B)</text><text x='20.00' y='62.00' font-size='4.5' text-anchor='start' fill='#111' font-weight='bold'>Índice</text><text x='24.00' y='70.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='bold'>Hoja 1</text><text x='46.00' y='70.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='normal'>Portada e índice</text><text x='24.00' y='76.50' font-size='3.4' text-anchor='start' fill='#111' font-weight='bold'>Hoja 2</text><text x='46.00' y='76.50' font-size='3.4' text-anchor='start' fill='#111' font-weight='normal'>Qué es, dónde va y lista de piezas (dibujo de situación)</text><text x='24.00' y='83.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='bold'>Hoja 3</text><text x='46.00' y='83.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='normal'>Pieza A · Carril de medida: vistas generales</text><text x='24.00' y='89.50' font-size='3.4' text-anchor='start' fill='#111' font-weight='bold'>Hoja 4</text><text x='46.00' y='89.50' font-size='3.4' text-anchor='start' fill='#111' font-weight='normal'>Pieza A · Secciones por las barreras y tabla de alturas</text><text x='24.00' y='96.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='bold'>Hoja 5</text><text x='46.00' y='96.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='normal'>Pieza A · Placa frontal y ranura · Pieza A-T (tapa) · Pieza A-S (portasensor)</text><text x='24.00' y='102.50' font-size='3.4' text-anchor='start' fill='#111' font-weight='bold'>Hoja 6</text><text x='46.00' y='102.50' font-size='3.4' text-anchor='start' fill='#111' font-weight='normal'>Pieza B · Cubilete de espera (sin fondo)</text><text x='24.00' y='109.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='bold'>Hoja 7</text><text x='46.00' y='109.00' font-size='3.4' text-anchor='start' fill='#111' font-weight='normal'>Impresión en Bambu Lab A1, montaje y comprobaciones</text><text x='20.00' y='121.50' font-size='4.5' text-anchor='start' fill='#111' font-weight='bold'>Criterios generales</text><text x='20.00' y='128.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>· Cotas en mm. Ángulos en grados. Material: PLA. Impresora: Bambu Lab A1, boquilla 0,4 mm.</text><text x='20.00' y='133.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>· Las medidas de agujeros y huecos ya están compensadas para impresión (salen un poco más pequeñas):</text><text x='20.00' y='138.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>   canal 3,4 (sale ~3,2) · ranura 25,2 (sale ~25,0) · LED 3 mm → Ø3,2 · M3 pasante → Ø3,5 · M2 autorroscante → Ø1,8.</text><text x='20.00' y='143.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>· Pared de montaje: la de la IZQUIERDA del canal mirando la máquina de frente. LEDs del lado de la pared,</text><text x='20.00' y='148.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>   fototransistores hacia el interior. Si se monta en la pared derecha, basta con hacer simetría en el CAD.</text><text x='20.00' y='153.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>· El canal se dibuja recto; los dos ángulos salen solos al montar: 12° por la cuña ("medio trapecio")</text><text x='20.00' y='158.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>   y 10° por la posición de los agujeros en la pared lateral (hoja 7).</text><text x='20.00' y='163.50' font-size='3.0' text-anchor='start' fill='#111' font-weight='normal'>· Diámetros de monedas de memoria: medidlos con calibre y ajustad la tabla de alturas (hoja 4) antes de imprimir.</text><text x='20.00' y='196.00' font-size='2.5' text-anchor='start' fill='#555' font-weight='normal'>Generado a partir del modelo paramétrico cad/rampa-monedas/modelo.py (mismas cotas que los STEP adjuntos).</text><rect x='191.00' y='180.00' width='100.00' height='24.00' fill='white' stroke='#111' stroke-width='0.4'/><line x1='191.000' y1='188.000' x2='291.000' y2='188.000' stroke='#111' stroke-width='0.25' stroke-linecap='round'/><line x1='191.000' y1='196.000' x2='291.000' y2='196.000' stroke='#111' stroke-width='0.25' stroke-linecap='round'/><line x1='253.000' y1='188.000' x2='253.000' y2='204.000' stroke='#111' stroke-width='0.25' stroke-linecap='round'/><text x='193.00' y='185.60' font-size='3.2' text-anchor='start' fill='#111' font-weight='bold'>Sistema de monedas</text><text x='193.00' y='193.20' font-size='2.6' text-anchor='start' fill='#111' font-weight='normal'>Portada e índice</text><text x='193.00' y='201.20' font-size='2.4' text-anchor='start' fill='#555' font-weight='normal'>SED 2026-27 · Máquina expendedora</text><text x='255.00' y='193.20' font-size='2.6' text-anchor='start' fill='#111' font-weight='normal'>Escala —</text><text x='255.00' y='201.20' font-size='2.4' text-anchor='start' fill='#555' font-weight='normal'>Hoja 1/7 · 2026-11-11</text><text x='289.00' y='18