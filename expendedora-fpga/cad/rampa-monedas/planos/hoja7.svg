<svg xmlns='http://www.w3.org/2000/svg' width='297mm' height='210mm' viewBox='0 0 297 210' font-family='DejaVu Sans, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id='ar' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='2.6' markerHeight='2.6' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0 1.5L10 5L0 8.5z' fill='#0b5cad'/></marker><marker id='ak' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='2.4' markerHeight='2.4' markerUnits='userSpaceOnUse' orient='auto-start-reverse'><path d='M0 1.5L10 5L0 8.5z' fill='#111'/></marker></defs><rect width='297' height='210' fill='white'/><rect x='6' y='6' width='285' height='198' fill='none' stroke='#111' stroke-width='0.5'/><text x='12.00' y='16.00' font-size='5' text-anchor='start' fill='#111' font-weight='bold'>Impresión</text><text x='12.00' y='25.00' font-size='2.8' text-anchor='start' fill='#111' font-weight='bold'>Ajustes comunes (PLA, boquilla 0,4)</text><text x='12.00' y='29.60' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>Capa 0,2 · 3 perímetros · relleno 15 % giroide · sin soportes en ninguna pieza.</text><text x='12.00' y='34.20' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'></text><text x='12.00' y='38.80' font-size='2.8' text-anchor='start' fill='#111' font-weight='bold'>Orientación</text><text x='12.00' y='43.40' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>A   De pie, con la cara frontal de la placa sobre la cama (el carril sube 150).</text><text x='12.00' y='48.00' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>     Así el canal y las paredes salen verticales y la ranura queda limpia.</text><text x='12.00' y='52.60' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>     Usad borde (brim) de 5 mm: la base es pequeña para la altura.</text><text x='12.00' y='57.20' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>A-T Plana, cara superior hacia arriba.</text><text x='12.00' y='61.80' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>A-S Plana, con la cara de la rendija sobre la cama (la rendija sale en las 3 primeras capas).</text><text x='12.00' y='66.40' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>B   De pie, con el borde abierto sobre la cama. Las lengüetas altas llevan chaflán a 45°.</text><text x='12.00' y='71.00' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'></text><text x='12.00' y='75.60' font-size='2.8' text-anchor='start' fill='#111' font-weight='bold'>Antes de la pieza grande, imprimid una probeta</text><text x='12.00' y='80.20' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>Un trozo de canal de 30 de largo con la ranura: comprobad que pasa el 50c (24,25)</text><text x='12.00' y='84.80' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>y no el 2 € (25,75), y que el hueco mide 3,2 ± 0,1. Si no, ajustad GAP y SLOT_H.</text><text x='155.00' y='16.00' font-size='5' text-anchor='start' fill='#111' font-weight='bold'>Montaje</text><text x='155.00' y='25.00' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>1. LEDs desde la cara de montaje, hasta el tope del diafragma.</text><text x='155.00' y='29.60' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>    Cables por el bolsillo y salida inferior; fijad con una gota de cola.</text><text x='155.00' y='34.20' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>2. Fototransistores P1 y P2 desde el interior, a tope.</text><text x='155.00' y='38.80' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>3. Portasensores A-S en B1 a B5 con M2 × 6, sin apretar.</text><text x='155.00' y='43.40' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>4. Atornillad A a la pared con 6 M3. En pared de PLA: insertos de</text><text x='155.00' y='48.00' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>    latón M3 (agujero Ø4,0 × 5) o tuerca por el otro lado.</text><text x='155.00' y='52.60' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>5. Calibrad B1 a B5 con monedas reales (rampa-monedas.md) y apretad.</text><text x='155.00' y='57.20' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>6. Tapa A-T con 2 M2 × 10.</text><text x='155.00' y='61.80' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>7. Cubilete B con 4 M3, debajo del final del carril.</text><text x='155.00' y='78.00' font-size='3.2' text-anchor='start' fill='#111' font-weight='bold'>Agujeros en la pared lateral (centro de cada lengüeta)</text><text x='155.00' y='83.00' font-size='2.3' text-anchor='start' fill='#555' font-weight='normal'>fondo = desde la cara exterior del frontal · altura = desde el suelo de la máquina</text><text x='155.00' y='90.00' font-size='2.4' text-anchor='start' fill='#555' font-weight='bold'>agujero</text><text x='205.00' y='90.00' font-size='2.4' text-anchor='start' fill='#555' font-weight='bold'>fondo</text><text x='228.00' y='90.00' font-size='2.4' text-anchor='start' fill='#555' font-weight='bold'>altura</text><text x='155.00' y='94.20' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>A sup x=20</text><text x='205.00' y='94.20' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>30,8</text><text x='228.00' y='94.20' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>388,8</text><text x='155.00' y='98.40' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>A inf x=20</text><text x='205.00' y='98.40' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>22,3</text><text x='228.00' y='98.40' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>340,8</text><text x='155.00' y='102.60' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>A sup x=80</text><text x='205.00' y='102.60' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>89,9</text><text x='228.00' y='102.60' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>378,4</text><text x='155.00' y='106.80' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>A inf x=80</text><text x='205.00' y='106.80' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>81,4</text><text x='228.00' y='106.80' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>330,4</text><text x='155.00' y='111.00' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>A sup x=140</text><text x='205.00' y='111.00' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>149</text><text x='228.00' y='111.00' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>368</text><text x='155.00' y='115.20' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>A inf x=140</text><text x='205.00' y='115.20' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>140,5</text><text x='228.00' y='115.20' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>319,9</text><text x='155.00' y='119.40' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>B del. z=6,5</text><text x='205.00' y='119.40' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>133,2</text><text x='228.00' y='119.40' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>282,5</text><text x='155.00' y='123.60' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>B tras. z=6,5</text><text x='205.00' y='123.60' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>192,2</text><text x='228.00' y='123.60' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>282,5</text><text x='155.00' y='127.80' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>B del. z=33,5</text><text x='205.00' y='127.80' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>133,2</text><text x='228.00' y='127.80' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>309,5</text><text x='155.00' y='132.00' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>B tras. z=33,5</text><text x='205.00' y='132.00' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>192,2</text><text x='228.00' y='132.00' font-size='2.4' text-anchor='start' fill='#111' font-weight='normal'>309,5</text><text x='155.00' y='138.00' font-size='2.3' text-anchor='start' fill='#555' font-weight='normal'>Supone R a 352 del suelo y placa de 4 a ras del frontal.</text><text x='155.00' y='142.00' font-size='2.3' text-anchor='start' fill='#555' font-weight='normal'>Los 6 agujeros de A quedan sobre líneas inclinadas 10°: así sale la pendiente.</text><text x='12.00' y='105.00' font-size='4' text-anchor='start' fill='#111' font-weight='bold'>Comprobaciones después de montar</text><text x='12.00' y='113.00' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>· Con un nivel de burbuja o el móvil: suelo del canal a 10° ± 1° y cara de los</text><text x='12.00' y='117.60' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>  fototransistores a 12° ± 1° de la vertical.</text><text x='12.00' y='122.20' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>· Cada moneda rueda de la ranura al cubilete sin pararse ni saltar (20 pasadas).</text><text x='12.00' y='126.80' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>· Ninguna moneda roza la tapa (si roza, revisad el grosor de la primera capa).</text><text x='12.00' y='131.40' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>· El final del carril queda dentro del cubilete visto desde arriba.</text><text x='12.00' y='136.00' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>· Con la tapa puesta, en la oscuridad del interior, cada fototransistor da</text><text x='12.00' y='140.60' font-size='2.8' text-anchor='start' fill='#111' font-weight='normal'>  señal clara tapado / destapado (polímetro).</text><rect x='191.00' y='180.00' width='100.00' height='24.00' fill='white' stroke='#111' stroke-width='0.4'/><line x1='191.000' y1='188.000' x2='291.000' y2='188.000' stroke='#111' stroke-width='0.25' stroke-linecap='round'/><line x1='191.000' y1='196.000' x2='291.000' y2='196.000' stroke='#111' stroke-width='0.25' stroke-linecap='round'/><line x1='253.000' y1='188.000' x2='253.000' y2='204.000' stroke='#111' stroke-width='0.25' stroke-linecap='round'/><text x='193.00' y='185.60' font-size='3.2' text-anchor='start' fill='#111' font-weight='bold'>Impresión y montaje</text><text x='193.00' y='193.20' font-size='2.6' text-anchor='start' fill='#111' font-weight='normal'>Bambu Lab A1 · PLA</text><text x='193.00' y='201.20' font-size='2.4' text-anchor='start' fill='#555' font-weight='normal'>SED 2026-27 · Máquina expendedora</text><text x='255.00' y='193.20' font-size='2.6' text-anchor='start' fill='#111' font-weight='normal'>Escala —</text><text x='255.00' y='201.20' font-size='2.4' text-anchor='start' fill='#555' font-weight='normal'>Hoja 7/7 · 2026-11-11</text><text x='289.00' y='185.60' font-size='2.2' text-anchor='end' fill='#555' font-weight='normal'>cotas en mm</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>