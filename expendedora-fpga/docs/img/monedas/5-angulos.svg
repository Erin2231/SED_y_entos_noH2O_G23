<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 470' width='760' height='470' font-family='DejaVu Sans, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><title>Angulos del carril</title><defs><marker id='a' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0b5cad'/></marker><marker id='b' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#1f2328'/></marker></defs><rect width='760' height='470' fill='white'/><text x='24.0' y='32.0' font-size='17' text-anchor='start' fill='#1f2328' font-weight='bold'>5 · Los dos ángulos del carril</text><text x='24.0' y='54.0' font-size='13' text-anchor='start' fill='#57606a' font-weight='normal'>α hace rodar la moneda hacia el fondo. β la deja apoyada en la pared de los sensores.</text><text x='200.0' y='100.0' font-size='14' text-anchor='middle' fill='#1f2328' font-weight='bold'>Vista lateral (de frente a fondo)</text><line x1='60.0' y1='160.0' x2='355.4' y2='212.1' stroke='#1f2328' stroke-width='4' /><line x1='60.0' y1='160.0' x2='375.4' y2='160.0' stroke='#57606a' stroke-width='1' stroke-dasharray='5 4' /><path d='M178.2 180.8A120 120 0 0 0 180.0 160.0' fill='none' stroke='#0b5cad' stroke-width='1.2'/><text x='190.0' y='176.0' font-size='14' text-anchor='start' fill='#0b5cad' font-weight='bold'>α = 10°</text><circle cx='200.8' cy='146.7' r='40' fill='#c9a227' fill-opacity='0.35' stroke='#c9a227' stroke-width='2'/><line x1='250.8' y1='136.7' x2='310.8' y2='146.7' stroke='#1f2328' stroke-width='1.5' marker-end='url(#b)'/><text x='60.0' y='242.1' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>frente</text><text x='355.4' y='242.1' font-size='12' text-anchor='end' fill='#57606a' font-weight='normal'>fondo</text><text x='60.0' y='268.1' font-size='12' text-anchor='start' fill='#1f2328' font-weight='normal'>Margen de prueba: 8° a 12°</text><text x='60.0' y='286.1' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>Por debajo de unos 5° el roce con la pared la para.</text><text x='60.0' y='304.1' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>Por encima de 15° rebota y llega demasiado rápida al vaso.</text><text x='560.0' y='100.0' font-size='14' text-anchor='middle' fill='#1f2328' font-weight='bold'>Sección (mirando desde el frente)</text><line x1='560.0' y1='300.0' x2='520.5' y2='114.2' stroke='#1f2328' stroke-width='4' /><line x1='575.7' y1='303.3' x2='536.1' y2='117.5' stroke='#1f2328' stroke-width='2' stroke-dasharray='6 4' /><line x1='554.1' y1='298.8' x2='581.5' y2='304.6' stroke='#1f2328' stroke-width='4' /><line x1='565.9' y1='301.2' x2='534.7' y2='154.5' stroke='#c9a227' stroke-width='9' /><line x1='560.0' y1='300.0' x2='560.0' y2='100.0' stroke='#57606a' stroke-width='1' stroke-dasharray='5 4' /><path d='M560.0 150.0A150 150 0 0 0 528.8 153.3' fill='none' stroke='#0b5cad' stroke-width='1.2'/><text x='520.0' y='140.0' font-size='14' text-anchor='end' fill='#0b5cad' font-weight='bold'>β = 12°</text><text x='512.5' y='154.2' font-size='12' text-anchor='end' fill='#1f2328' font-weight='normal'>pared trasera</text><text x='512.5' y='170.2' font-size='12' text-anchor='end' fill='#57606a' font-weight='normal'>(fototransistores)</text><text x='605.7' y='183.3' font-size='12' text-anchor='start' fill='#1f2328' font-weight='normal'>pared delantera</text><text x='605.7' y='199.3' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>(LEDs)</text><text x='591.9' y='271.2' font-size='12' text-anchor='start' fill='#c9a227' font-weight='bold'>moneda</text><text x='440.0' y='346.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='normal'>Margen de prueba: 10° a 15°</text><text x='440.0' y='364.0' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>Más β = más roce con la pared;</text><text x='440.0' y='382.0' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>por eso α debe crecer si sube β.</text><text x='24.0' y='430.0' font-size='13' text-anchor='start' fill='#1f2328' font-weight='normal'>Condición para que no se pare: sen α > μ · sen β (μ ≈ 0,35 entre PLA y metal, estimado).</text><text x='24.0' y='450.0' font-size='13' text-anchor='start' fill='#57606a' font-weight='normal'>Con β = 12° basta α > 4,2°; con α = 10° hay más del doble de margen.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>