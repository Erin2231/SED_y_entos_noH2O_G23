<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 960' width='760' height='960' font-family='DejaVu Sans, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><title>Compuerta y rampas</title><defs><marker id='a' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0b5cad'/></marker><marker id='b' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#1f2328'/></marker></defs><rect width='760' height='960' fill='white'/><text x='24.0' y='32.0' font-size='17' text-anchor='start' fill='#1f2328' font-weight='bold'>6 · Compuerta de 3 posiciones y separación hucha / devolución</text><text x='24.0' y='54.0' font-size='13' text-anchor='start' fill='#57606a' font-weight='normal'>Sección lateral (frente a la izquierda, fondo a la derecha). Cotas en mm desde el suelo de la máquina.</text><line x1='180.0' y1='195.0' x2='356.0' y2='226.0' stroke='#c62828' stroke-width='5' /><text x='188.0' y='260.0' font-size='12' text-anchor='start' fill='#c62828' font-weight='bold'>llega del carril</text><line x1='356.0' y1='250.0' x2='356.0' y2='394.0' stroke='#1f2328' stroke-width='3' /><line x1='516.0' y1='194.0' x2='516.0' y2='394.0' stroke='#1f2328' stroke-width='3' /><text x='436.0' y='282.0' font-size='12' text-anchor='middle' fill='#1f2328' font-weight='bold'>vaso de espera</text><text x='436.0' y='306.0' font-size='11' text-anchor='middle' fill='#57606a' font-weight='normal'>40 × 40 × 40</text><line x1='360.0' y1='402.0' x2='512.0' y2='402.0' stroke='#1f2328' stroke-width='5' /><line x1='377.8' y1='450.9' x2='494.2' y2='353.1' stroke='#2e7d32' stroke-width='3' stroke-dasharray='6 4' /><line x1='377.8' y1='353.1' x2='494.2' y2='450.9' stroke='#0b5cad' stroke-width='3' stroke-dasharray='6 4' /><circle cx='436.0' cy='402.0' r='5' fill='white' stroke='#1f2328' stroke-width='2'/><text x='346.0' y='406.0' font-size='11' text-anchor='end' fill='#1f2328' font-weight='normal'>eje del servo SG90</text><line x1='436.0' y1='466.0' x2='228.0' y2='601.1' stroke='#1f2328' stroke-width='3' /><line x1='436.0' y1='466.0' x2='644.0' y2='601.1' stroke='#1f2328' stroke-width='3' /><text x='436.0' y='510.0' font-size='11' text-anchor='middle' fill='#1f2328' font-weight='bold'>cresta separadora</text><text x='436.0' y='526.0' font-size='11' text-anchor='middle' fill='#57606a' font-weight='normal'>justo bajo el eje</text><line x1='228.0' y1='601.1' x2='156.0' y2='647.8' stroke='#2e7d32' stroke-width='2' marker-end='url(#b)'/><text x='156.0' y='669.8' font-size='12' text-anchor='start' fill='#2e7d32' font-weight='bold'>a la bandeja</text><text x='156.0' y='685.8' font-size='11' text-anchor='start' fill='#57606a' font-weight='normal'>(rampa ≥ 30°)</text><line x1='644.0' y1='601.1' x2='716.0' y2='647.8' stroke='#0b5cad' stroke-width='2' marker-end='url(#a)'/><text x='716.0' y='669.8' font-size='12' text-anchor='end' fill='#0b5cad' font-weight='bold'>a la hucha</text><path d='M366.0 466.0A70 70 0 0 0 377.3 504.1' fill='none' stroke='#0b5cad' stroke-width='1.2'/><text x='356.0' y='470.0' font-size='12' text-anchor='end' fill='#0b5cad' font-weight='normal'>33°</text><path d='M496.0 402.0A60 60 0 0 0 482.0 363.4' fill='none' stroke='#0b5cad' stroke-width='1.2'/><text x='500.0' y='376.0' font-size='12' text-anchor='start' fill='#0b5cad' font-weight='normal'>40°</text><line x1='60.0' y1='830.0' x2='90.0' y2='830.0' stroke='#1f2328' stroke-width='4' /><text x='100.0' y='834.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='normal'>RETENER: 1,5 ms, 0° (horizontal)</text><line x1='60.0' y1='854.0' x2='90.0' y2='854.0' stroke='#2e7d32' stroke-width='3' stroke-dasharray='6 4' /><text x='100.0' y='858.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='normal'>DEVOLVER: 40° con el fondo arriba</text><line x1='60.0' y1='878.0' x2='90.0' y2='878.0' stroke='#0b5cad' stroke-width='3' stroke-dasharray='6 4' /><text x='100.0' y='882.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='normal'>COBRAR: 40° con el frente arriba</text><line x1='356.0' y1='194.0' x2='356.0' y2='158.0' stroke='#0b5cad' stroke-width='0.8' /><line x1='516.0' y1='194.0' x2='516.0' y2='158.0' stroke='#0b5cad' stroke-width='0.8' /><line x1='356.0' y1='162.0' x2='516.0' y2='162.0' stroke='#0b5cad' stroke-width='1' marker-start='url(#a)' marker-end='url(#a)'/><text x='436.0' y='157.0' font-size='12' text-anchor='middle' fill='#0b5cad' font-weight='normal'>40</text><line x1='516.0' y1='402.0' x2='570.0' y2='402.0' stroke='#0b5cad' stroke-width='0.8' /><line x1='516.0' y1='466.0' x2='570.0' y2='466.0' stroke='#0b5cad' stroke-width='0.8' /><line x1='566.0' y1='402.0' x2='566.0' y2='466.0' stroke='#0b5cad' stroke-width='1' marker-start='url(#a)' marker-end='url(#a)'/><text x='572.0' y='438.0' font-size='12' text-anchor='start' fill='#0b5cad' font-weight='normal'>16</text><text x='574.0' y='454.0' font-size='11' text-anchor='start' fill='#57606a' font-weight='normal'>hueco eje–cresta</text><text x='24.0' y='920.0' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>La compuerta es el fondo del vaso y gira sobre su centro. Al inclinarse, las monedas resbalan por el borde bajo</text><text x='24.0' y='938.0' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>y caen a un lado u otro de la cresta: es imposible que una moneda de la devolución acabe en la hucha.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>