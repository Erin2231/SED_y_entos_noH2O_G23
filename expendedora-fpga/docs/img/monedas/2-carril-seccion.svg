<line x1='338.2' y1='182.3' x2='590.0' y2='140.0' stroke='#57606a' stroke-width='0.8' /><text x='594.0' y='144.0' font-size='12' text-anchor='start' fill='#1f2328' font-weight='normal'>Tapa (3 mm)</text><line x1='437.5' y1='543.5' x2='534.3' y2='523.0' stroke='#0b5cad' stroke-width='0.7' /><line x1='385.4' y1='298.8' x2='482.3' y2='278.2' stroke='#0b5cad' stroke-width='0.7' /><line x1='534.3' y1='523.0' x2='482.3' y2='278.2' stroke='#0b5cad' stroke-width='1' marker-start='url(#a)' marker-end='url(#a)'/><text x='542.3' y='404.6' font-size='12' text-anchor='middle' fill='#0b5cad' font-weight='normal'>22,75</text><line x1='437.5' y1='543.5' x2='620.4' y2='504.7' stroke='#0b5cad' stroke-width='0.7' /><line x1='364.3' y1='199.2' x2='547.2' y2='160.3' stroke='#0b5cad' stroke-width='0.7' /><line x1='620.4' y1='504.7' x2='547.2' y2='160.3' stroke='#0b5cad' stroke-width='1' marker-start='url(#a)' marker-end='url(#a)'/><text x='627.8' y='336.5' font-size='12' text-anchor='middle' fill='#0b5cad' font-weight='normal'>32 interior</text><line x1='360.0' y1='560.0' x2='373.7' y2='624.6' stroke='#0b5cad' stroke-width='0.7' /><line x1='394.4' y1='552.7' x2='408.2' y2='617.2' stroke='#0b5cad' stroke-width='0.7' /><line x1='373.7' y1='624.6' x2='408.2' y2='617.2' stroke='#0b5cad' stroke-width='1' marker-start='url(#a)' marker-end='url(#a)'/><text x='390.9' y='636.9' font-size='12' text-anchor='middle' fill='#0b5cad' font-weight='normal'>3,2</text><line x1='317.0' y1='569.1' x2='330.7' y2='633.7' stroke='#0b5cad' stroke-width='0.7' /><line x1='360.0' y1='560.0' x2='373.7' y2='624.6' stroke='#0b5cad' stroke-width='0.7' /><line x1='330.7' y1='633.7' x2='373.7' y2='624.6' stroke='#0b5cad' stroke-width='1' marker-start='url(#a)' marker-end='url(#a)'/><text x='346.2' y='645.1' font-size='12' text-anchor='middle' fill='#0b5cad' font-weight='normal'>4</text><line x1='394.4' y1='552.7' x2='408.2' y2='617.2' stroke='#0b5cad' stroke-width='0.7' /><line x1='437.5' y1='543.5' x2='451.2' y2='608.1' stroke='#0b5cad' stroke-width='0.7' /><line x1='408.2' y1='617.2' x2='451.2' y2='608.1' stroke='#0b5cad' stroke-width='1' marker-start='url(#a)' marker-end='url(#a)'/><text x='435.7' y='628.7' font-size='12' text-anchor='middle' fill='#0b5cad' font-weight='normal'>4</text><text x='296.0' y='188.6' font-size='12' text-anchor='end' fill='#0b5cad' font-weight='normal'>12° respecto a la vertical</text><text x='24.0' y='700.0' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>Altura de cada barrera = distancia desde el suelo del canal, medida a lo largo de la pared trasera.</text><text x='24.0' y='718.0' font-size='12' text-anchor='start' fill='#57606a' font-weight='normal'>Como el suelo es perpendicular a la pared, esa altura coincide con el diámetro de la moneda que la corta.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>