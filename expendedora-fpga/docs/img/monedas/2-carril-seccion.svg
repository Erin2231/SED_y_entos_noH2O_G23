<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 740' width='760' height='740' font-family='DejaVu Sans, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><title>Sección transversal del canal</title><defs><marker id='a' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0b5cad'/></marker><marker id='b' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#1f2328'/></marker></defs><rect width='760' height='740' fill='white'/><text x='24.0' y='32.0' font-size='17' text-anchor='start' fill='#1f2328' font-weight='bold'>2 · Sección transversal por una barrera (B4), escala 11:1 en pantalla</text><text x='24.0' y='54.0' font-size='13' text-anchor='start' fill='#57606a' font-weight='normal'>El canal entero va inclinado 12° hacia atrás: la moneda se apoya en la pared con el fototransistor.</text><g transform='translate(360 560) rotate(-12)'><rect x='-44.0' y='-352.0' width='44.0' height='385.0' fill='#d9d9d9' fill-opacity='1' stroke='#1f2328' stroke-width='1.5'/><rect x='35.2' y='-352.0' width='44.0' height='385.0' fill='#d9d9d9' fill-opacity='1' stroke='#1f2328' stroke-width='1.5'/><rect x='-44.0' y='0.0' width='123.19999999999999' height='33.0' fill='#d9d9d9' fill-opacity='1' stroke='#1f2328' stroke-width='1.5'/><rect x='-44.0' y='-385.0' width='123.19999999999999' height='33.0' fill='#d9d9d9' fill-opacity='1' stroke='#1f2328' stroke-width='1.5'/><rect x='-44.0' y='-267.85' width='44.0' height='35.20000000000003' fill='white' fill-opacity='1' stroke='#1f2328' stroke-width='1'/><rect x='35.2' y='-267.85' width='44.0' height='35.20000000000003' fill='white' fill-opacity='1' stroke='#1f2328' stroke-width='1'/><rect x='-13.2' y='-267.85' width='13.2' height='12.100000000000016' fill='#1f2328' fill-opacity='1' stroke='#1f2328' stroke-width='0.5'/><rect x='-13.2' y='-244.75' width='13.2' height='12.1000000