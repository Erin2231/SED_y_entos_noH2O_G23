<text x='600.0' y='302.0' font-size='12' text-anchor='start' fill='#c62828' font-weight='normal'>IR del LED</text>
<line x1='691.0' y1='285.0' x2='820.0' y2='162.0' stroke='#666' stroke-width='1'/><circle cx='691.0' cy='285.0' r='2.5' fill='#666'/>
<text x='825.0' y='166.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>ventana 2,5 × 5 en la pared A-F</text>
<line x1='712.0' y1='305.0' x2='820.0' y2='190.0' stroke='#666' stroke-width='1'/><circle cx='712.0' cy='305.0' r='2.5' fill='#666'/>
<text x='825.0' y='194.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>rendija 1 × 2,5 del A-S: marca la altura de la barrera</text>
<line x1='691.0' y1='180.0' x2='820.0' y2='218.0' stroke='#666' stroke-width='1'/><circle cx='691.0' cy='180.0' r='2.5' fill='#666'/>
<text x='825.0' y='222.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>carril guía 0,5 (pared de 3,5 desde 14 bajo la barrera hasta arriba)</text>
<line x1='724.0' y1='340.0' x2='890.0' y2='380.0' stroke='#666' stroke-width='1'/><circle cx='724.0' cy='340.0' r='2.5' fill='#666'/>
<text x='895.0' y='384.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>portasensor A-S (3 de grosor)</text>
<line x1='746.0' y1='371.0' x2='890.0' y2='440.0' stroke='#666' stroke-width='1'/><circle cx='746.0' cy='371.0' r='2.5' fill='#666'/>
<text x='895.0' y='444.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>M2 × 6 por la colisa 2,4 × 5</text>
<line x1='694.0' y1='399.0' x2='890.0' y2='470.0' stroke='#666' stroke-width='1'/><circle cx='694.0' cy='399.0' r='2.5' fill='#666'/>
<text x='895.0' y='474.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>guía Ø1,8 × 3 en la pared (0,5 hasta el canal)</text>
<text x='640.0' y='550.0' font-size='14' text-anchor='start' fill='#1b1b1b' font-weight='bold'>Pasos</text>
<text x='640.0' y='575.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>1. Fototransistor en el A-S desde atrás hasta que toque la rendija; gota de cola.</text>
<text x='640.0' y='596.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>2. A-S en su carril, rendija contra la pared, M2 × 6 sin apretar.</text>
<text x='640.0' y='617.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>3. Con la tapa puesta, haced rodar las dos monedas que separa esa barrera.</text>
<text x='640.0' y='638.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>4. Subid/bajad el A-S hasta que la grande corte y la pequeña no. Apretad.</text>
<text x='640.0' y='659.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>5. Orden: B1, B2, B3, B4, B5 (tabla de la hoja 4).</text>
<text x='40.0' y='740.0' font-size='13' text-anchor='start' fill='#666' font-weight='normal'>Conexión: colector al pull-up de 10 kΩ a 3,3 V y a la FPGA; emisor a GND (tapado = 1). Cuál es cada pata depende del modelo: miradlo en su hoja de datos.</text>
