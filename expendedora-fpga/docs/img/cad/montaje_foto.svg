<text x='40' y='42' font-size='24' font-weight='bold' fill='#1b1b1b'>Montaje de los fototransistores en la pared A-F</text>
<text x='40' y='68' font-size='14' fill='#666'>Cortes esquemáticos a escala 10:1 aprox., con el canal dibujado recto. El LED está en la otra pared, a la izquierda de cada corte.</text>
<text x='60.0' y='112.0' font-size='17' text-anchor='start' fill='#1b1b1b' font-weight='bold'>1 · P1 y P2: fototransistor fijo en la pared</text>
