<text x='245.0' y='174.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>diafragma Ø2 × 0,6 (tope de la cúpula)</text>
<line x1='119.0' y1='326.0' x2='240.0' y2='450.0' stroke='#666' stroke-width='1'/><circle cx='119.0' cy='326.0' r='2.5' fill='#666'/>
<text x='245.0' y='454.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>agujero Ø3,2 en la pared A-F (4 de grosor)</text>
<line x1='152.0' y1='283.0' x2='240.0' y2='210.0' stroke='#666' stroke-width='1'/><circle cx='152.0' cy='283.0' r='2.5' fill='#666'/>
<text x='245.0' y='214.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>gota de cola caliente (no tapar la cúpula)</text>
<line x1='144.0' y1='329.0' x2='240.0' y2='490.0' stroke='#666' stroke-width='1'/><circle cx='144.0' cy='329.0' r='2.5' fill='#666'/>
<text x='245.0' y='494.0' font-size='12.5' text-anchor='start' fill='#1b1b1b' font-weight='normal'>pestaña del fototransistor queda por fuera</text>
<text x='60.0' y='550.0' font-size='14' text-anchor='start' fill='#1b1b1b' font-weight='bold'>Pasos</text>
<text x='60.0' y='575.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>1. Meted el fototransistor desde fuera hasta que la cúpula toque el diafragma.</text>
<text x='60.0' y='596.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>2. Misma orientación de patas en P1 y P2 (emisor siempre del mismo lado).</text>
<text x='60.0' y='617.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>3. Gota de cola caliente alrededor de la pestaña. No hay ajuste: las corta</text>
<text x='60.0' y='638.0' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>    cualquier moneda (10 mm, la menor mide 16,25).</text>
<text x='640.0' y='112.0' font-size='17' text-anchor='start' fill='#1b1b1b' font-weight='bold'>2 · B1 a B5: fototransistor en el portasensor A-S (corte)</text>
