<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 940' width='1600' height='940' font-family='DejaVu Sans, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id='ai' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#1b1b1b'/></marker><marker id='ap' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#c62828'/></marker><marker id='as' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#1458a8'/></marker><marker id='av' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#8e24aa'/></marker></defs>
<rect width='1600' height='940' fill='white'/>
<text x='30' y='40' font-size='24' text-anchor='start' fill='#1b1b1b' font-weight='bold'>Diagrama de bloques · hardware</text>
<text x='30' y='64' font-size='14' text-anchor='start' fill='#5f6368' font-weight='normal'>Máquina expendedora SED 2026-27 · qué se conecta con qué (Pmod a 3,3 V; los pines de la FPGA no toleran 5 V)</text>
<rect x='640' y='90' width='320' height='70' rx='8' fill='#ffebee' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='800.0' y='112' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Fuente 5 V · 3 A (enchufe)</text>
<text x='800.0' y='132' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>jack DC en la trasera</text>
<rect x='560' y='230' width='480' height='330' rx='8' fill='#f3e5f5' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='800.0' y='252' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Placa de conexiones</text>
<text x='800.0' y='272' font-size='12.5' text-anchor='middle' fill='#5f6368' font-weight='normal'>(primero protoboard, luego placa soldada)</text>
<text x='800.0' y='289' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>reparto de 5 V y GND común (en estrella)</text>
<text x='800.0' y='306' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>7 × 10 kΩ pull-up a 3,3 V (fototransistores)</text>
<text x='800.0' y='323' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>7 × 220 Ω (LED IR a 5 V)</text>
<text x='800.0' y='340' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>470 µF + 100 nF junto a los servos</text>
<text x='800.0' y='357' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>4 × 10 kΩ pull-down (filas del numpad)</text>
<text x='800.0' y='374' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>divisor de contraste del LCD</text>
<text x='800.0' y='391' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>tiras de pines a JA, JB, JC, JD</text>
<text x='800.0' y='408' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>conectores para desmontar cada periférico</text>
<rect x='1150' y='230' width='400' height='330' rx='8' fill='#e0f7fa' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='1350.0' y='252' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Nexys 4 DDR (sobre el techo)</text>
<text x='1350.0' y='272' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>toda la lógica en VHDL</text>
<text x='1350.0' y='289' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>JA · barreras (7)</text>
<text x='1350.0' y='306' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>JB · numpad 3×4 + cancelar (8)</text>
<text x='1350.0' y='323' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>JC · LCD (6)</text>
<text x='1350.0' y='340' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>JD · servos (6)</text>
<text x='1350.0' y='357' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>alimentada por su jack de 5 V (JP3 en «WALL»)</text>
<text x='1350.0' y='374' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>USB y jack hacia atrás</text>
<text x='1350.0' y='391' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>7 segmentos + LED: depuración</text>
<rect x='40' y='180' width='400' height='150' rx='8' fill='#e3f2fd' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='240.0' y='202' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Rampa de monedas (pieza A)</text>
<text x='240.0' y='222' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>7 barreras IR: P1, B1-B5, P2</text>
<text x='240.0' y='239' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>7 LED IR 940 nm (lado pared)</text>
<text x='240.0' y='256' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>7 fototransistores (pared A-F y A-S)</text>
<rect x='40' y='370' width='400' height='120' rx='8' fill='#e3f2fd' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='240.0' y='392' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Frontal: numpad 3×4 + cancelar</text>
<text x='240.0' y='412' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>producto por su número (1-4)</text>
<text x='240.0' y='429' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>Cancelar: devuelve lo del escrow</text>
<rect x='40' y='590' width='400' height='150' rx='8' fill='#e8f5e9' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='240.0' y='612' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Compuertas de monedas</text>
<text x='240.0' y='632' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>SG90 #1 · trampilla del cubilete B</text>
<text x='240.0' y='649' font-size='12.5' text-anchor='middle' fill='#5f6368' font-weight='normal'>(retener / devolución / depósito)</text>
<text x='240.0' y='666' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>SG90 #2 · trampilla del depósito C</text>
<text x='240.0' y='683' font-size='12.5' text-anchor='middle' fill='#5f6368' font-weight='normal'>(cerrado / hucha / devolución)</text>
<rect x='560' y='640' width='480' height='110' rx='8' fill='#e8f5e9' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='800.0' y='662' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Salida de productos</text>
<text x='800.0' y='682' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>4 × SG90 · empujador o trampilla</text>
<text x='800.0' y='699' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>2 estantes × 2 productos</text>
<rect x='1150' y='640' width='400' height='110' rx='8' fill='#e8f5e9' stroke='#1b1b1b' stroke-width='1.5'/>
<text x='1350.0' y='662' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>Pantalla LCD 16 × 2 (frontal)</text>
<text x='1350.0' y='682' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>HD44780, modo 4 bits (RS, E, D4-D7)</text>
<text x='1350.0' y='699' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>RW a GND · alimentada a 5 V</text>
<rect x='1150' y='90' width='400' height='70' rx='8' fill='#eceff1' stroke='#1b1b1b' stroke-width='1.5' stroke-dasharray='6 4'/>
<text x='1350.0' y='112' font-size='14' text-anchor='middle' fill='#1b1b1b' font-weight='bold'>PC (programación)</text>
<text x='1350.0' y='132' font-size='12.5' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>cable USB por la trasera</text>
<polyline points='800,160 800,228' fill='none' stroke='#c62828' stroke-width='2' marker-end='url(#ap)'/>
<text x='830' y='200' font-size='12' text-anchor='middle' fill='#c62828' font-weight='normal'>5 V</text>
<polyline points='1040,250 1148,250' fill='none' stroke='#c62828' stroke-width='2' marker-end='url(#ap)'/>
<text x='1094' y='244' font-size='12' text-anchor='middle' fill='#c62828' font-weight='normal'>5 V → jack</text>
<polyline points='560,260 442,260' fill='none' stroke='#c62828' stroke-width='2' marker-end='url(#ap)'/>
<text x='500' y='252' font-size='12' text-anchor='middle' fill='#c62828' font-weight='normal'>5 V LED</text>
<polyline points='560,520 520,520 520,620 442,620' fill='none' stroke='#c62828' stroke-width='2' marker-end='url(#ap)'/>
<text x='480' y='612' font-size='12' text-anchor='middle' fill='#c62828' font-weight='normal'>5 V servos</text>
<polyline points='800,560 800,638' fill='none' stroke='#c62828' stroke-width='2' marker-end='url(#ap)'/>
<text x='850' y='605' font-size='12' text-anchor='middle' fill='#c62828' font-weight='normal'>5 V servos</text>
<polyline points='1000,560 1000,600 1250,600 1250,638' fill='none' stroke='#c62828' stroke-width='2' marker-end='url(#ap)'/>
<text x='1120' y='594' font-size='12' text-anchor='middle' fill='#c62828' font-weight='normal'>5 V LCD</text>
<polyline points='442,300 558,300' fill='none' stroke='#1458a8' stroke-width='2' marker-end='url(#as)'/>
<text x='500' y='292' font-size='12' text-anchor='middle' fill='#1458a8' font-weight='normal'>7 señales</text>
<polyline points='442,430 558,430' fill='none' stroke='#1458a8' stroke-width='2' marker-end='url(#as)'/>
<text x='500' y='422' font-size='12' text-anchor='middle' fill='#1458a8' font-weight='normal'>8 señales</text>
<polyline points='1040,330 1148,330' fill='none' stroke='#1458a8' stroke-width='2' marker-end='url(#as)' marker-start='url(#as)'/>
<text x='1094' y='322' font-size='12' text-anchor='middle' fill='#1458a8' font-weight='normal'>JA, JB, JC, JD</text>
<polyline points='560,545 500,545 500,690 442,690' fill='none' stroke='#1458a8' stroke-width='2' marker-end='url(#as)'/>
<text x='470' y='682' font-size='12' text-anchor='middle' fill='#1458a8' font-weight='normal'>2 × PWM</text>
<polyline points='900,560 900,638' fill='none' stroke='#1458a8' stroke-width='2' marker-end='url(#as)'/>
<text x='935' y='605' font-size='12' text-anchor='middle' fill='#1458a8' font-weight='normal'>4 × PWM</text>
<polyline points='1350,560 1350,638' fill='none' stroke='#1458a8' stroke-width='2' marker-end='url(#as)'/>
<text x='1405' y='605' font-size='12' text-anchor='middle' fill='#1458a8' font-weight='normal'>RS, E, D4-D7</text>
<polyline points='1350,162 1350,228' fill='none' stroke='#1b1b1b' stroke-width='2' marker-end='url(#ai)' marker-start='url(#ai)'/>
<text x='1375' y='200' font-size='12' text-anchor='middle' fill='#1b1b1b' font-weight='normal'>USB</text>
<line x1='40' y1='800' x2='80' y2='800' stroke='#c62828' stroke-width='2.5'/>
<text x='90' y='805' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>alimentación 5 V</text>
<line x1='40' y1='828' x2='80' y2='828' stroke='#1458a8' stroke-width='2.5'/>
<text x='90' y='833' font-size='13' text-anchor='start' fill='#1b1b1b' font-weight='normal'>señal lógica 3,3 V (Pmod)</text>
<text x='40' y='870' font-size='13' text-anchor='start' fill='#5f6368' font-weight='normal'>GND común a todo. Los servos aceptan la señal de 3,3 V de la FPGA. El LCD a 5 V lee bien 3,3 V (solo se le escribe, RW a GND).</text>
<text x='40' y='892' font-size='13' text-anchor='start' fill='#5f6368' font-weight='normal'>Pines: 27 de 32 usados (JA 7, JB 8, JC 6, JD 6). Quedan 5 libres para el sonido u otros extras.</text>
